<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="DSH"><title>DSH · 重新配对</title><link rel="apple-touch-icon" href="/apple-touch-icon.png"><style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fb;color:#172033}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}.card{width:100%;max-width:440px;padding:28px 24px;background:#fff;border:1px solid #e5eaf3;border-radius:24px;box-shadow:0 12px 40px #18274a0d}img{width:64px;height:64px;border-radius:16px}h1{font-size:25px;line-height:1.3;margin:20px 0 12px}p{font-size:16px;line-height:1.7;color:#566078;margin:12px 0}label{display:block;font-size:15px;font-weight:600;margin:24px 0 8px}input,button{width:100%;min-height:48px;border-radius:12px;font:inherit;font-size:16px}input{border:1px solid #cbd3e1;padding:12px;background:transparent;color:inherit}button{border:0;margin-top:14px;padding:12px;background:#3b63ec;color:#fff;font-weight:600}input:focus-visible,button:focus-visible{outline:3px solid #aac0ff;outline-offset:2px}.note{font-size:14px}.error{min-height:24px;color:#bc2739;font-size:14px;line-height:1.5}@media(prefers-color-scheme:dark){:root{background:#101521;color:#edf1ff}.card{background:#1a2232;border-color:#303b50}p{color:#b8c2d9}input{border-color:#53617a}.error{color:#ff98a7}}
</style></head><body><main class="card"><img src="/apple-touch-icon.png" alt="DSH"><h1>连接已建立，需要重新配对</h1><p>这个页面的授权已失效或尚未保存。对话和 Mac 上的任务都还在。</p><p>在 Mac 上双击「DSH手机连接」，然后回到这里粘贴专属链接。</p><form id="pair-form"><label for="pair-link">DSH 专属配对链接</label><input id="pair-link" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="长按此处粘贴链接" required><button type="submit">重新配对并打开对话</button><p id="pair-error" class="error" role="alert" aria-live="polite"></p></form><p class="note">请在当前主屏幕页面完成配对，无需删除图标。专属链接只用于连接自己的 Mac，不要发到聊天里。</p></main><script>
'use strict';document.getElementById('pair-form').addEventListener('submit',function(event){event.preventDefault();const input=document.getElementById('pair-link');const error=document.getElementById('pair-error');try{const target=new URL(input.value.trim());const keys=target.searchParams.getAll('k');if(target.origin!==location.origin||target.pathname!=='/'||keys.length!==1||!/^[A-Za-z0-9_-]{32,128}$/.test(keys[0]))throw new Error();input.value='';error.textContent='正在恢复连接…';location.replace(target.href);}catch(_){error.textContent='这不是当前 DSH 入口的配对链接，请重新运行 Mac 上的「DSH手机连接」。';}});
</script></body></html>
